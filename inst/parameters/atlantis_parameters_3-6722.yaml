  #   FunctGroupArray[guild].speciesParams[<id>].
  # All keys are indexed by GRP (0..K_num_tot_sp-1 functional group code).
  # value_type follows the .check field (binary/integer_check ->
  #   int, else double). The paramType (SP_*) is the gating set (shown as
  #   conditional_on). source_file: biology_prm for all.
