# =============================================================================
# Atlantis parameter catalogue  --  Lake Erie model
# =============================================================================
# Auto-extracted from the Atlantis C source (AtlantisTrunk/atlantis) by static
# analysis of every parameter read. Each entry records: which input file the
# parameter comes from, its format, and whether it is stored in the `bm`
# (MSEBoxModel) structure object. Scope: core run files only.
#
# Field reference
#   name           key string in the input file (sprintf-built keys use <...> placeholders)
#   description    one-line meaning
#   source_file    logical input file (see `files:` below)
#   value_type     double | int | string | double_array | int_array | string_array
#   dimension      scalar | per_box | per_layer | per_group | per_cohort |
#                  per_fishery | per_prey | timeseries | other
#   units          physical units or null
#   bm_member      the value is stored in the MSEBoxModel, gives exact C lvalue it is read into, null
#   reader.fn      C reader function;  reader.at  file:line;  reader.check  validation arg
#   conditional_on C condition gating whether the parameter is read (or null)
# Placeholders in names (<GRP>, <f>, ...) are documented under `abbreviation:`.
# =============================================================================

meta:
  atlantis_source: AtlantisTrunk/atlantis
  atlantis_version: 3.6722
  bm_struct: MSEBoxModel
  files:
    physics_prm:
      cli_flag: "-p"
      bm_field: physprmIfname
      reader_mechanism: "direct key-value (readkeyprm_*)"
    run_prm:
      cli_flag: "-r"
      bm_field: runprmIfname
      reader_mechanism: "prm->XML (Util_XML_Read_*)"
    biology_prm:
      cli_flag: "-b"
      bm_field: bioprmIfname
      reader_mechanism: "prm->XML (Util_XML_Read_Species_Param etc.)"
    forcing_prm:
      cli_flag: "-f"
      bm_field: forceIfname
      reader_mechanism: "direct key-value (readkeyprm_*)"
    harvest_prm:
      cli_flag: "-h"
      bm_field: fishprmIfname
      reader_mechanism: "prm->XML (Util_XML_Read_Fishery_Param etc.)"
    groups_csv:
      cli_flag: "-s"
      bm_field: functionGroupIfname
      reader_mechanism: "csv->XML (Util_Read_Functional_Group_XML)"
    fisheries_csv:
      cli_flag: "-q"
      bm_field: fisheryIfname
      reader_mechanism: "csv->XML (Util_Read_Fisheries_XML)"

# <...> placeholder patterns used in parameter names, key templates, and comments
abbreviations:
  GRP: "species (functional) group code, e.g. FPS; range 0..K_num_tot_sp-1"
  "f": "fishery name/code (per-fishery harvest parameters, bm->FISHERYprms[f])"
  id: "species-parameter index into FunctGroupArray[guild].speciesParams[<id>] (slot in the speciesParamStructArray[] master table)"
  base: "parameter base-name prefix in per-group keys of the form <base>_<GRP> (e.g. mum, C); uppercase <BASE> used in comment blocks"
  i: "loop index: file index in a forcing-file series (e.g. hd<i>.name, <tracerName>_File<i>.name) or change-schedule index in pss keys (pss<s>_change<i>)"
  s: "point source/sink index, 0..npss-1 (e.g. pss<s>_numchanges)"
  tracerName: "name of a generic forcing tracer (netCDF forcing input, bm->forceTracerInput[])"
  PRED: "predator group code in diet-availability keys pPREY<PREDCOHORT><PRED><PREYCOHORT>"
  "N": "migration event index (Migrate<N>: 1..num_migrate; KMIG_INVERT<N>: 0..num_migrate-1)"
  shortName: "short name of a physical-property forcing series (e.g. temp, salt, pH, Wind, vertMixScalar) used in keys like n<shortName>files"
  COHORT: "age class (cohort) of an age-structured group, e.g. in MigrateIOBox/<GRP>[/<COHORT>]/Migrate<N>"
  suffix: "parameter suffix in per-group keys of the form <GRP>_<suffix>; uppercase <SUFFIX> used in comment blocks"
  moveGroupCode: "moving group/stage code listed in MoveGroupCodes (forced-movement entries, form <code>_stage_<n>)"
  coh: "age-class (cohort) index in harvest keys, e.g. qStock_<GRP>_<coh>, sel_<GRP><coh>"
  PREYCOHORT: "prey life-stage digit in pPREY keys (1 = juvenile, 2 = adult)"
  PREDCOHORT: "predator life-stage digit in pPREY keys (1 = juvenile, 2 = adult)"
  "n": "stage number in a moving group/stage code <code>_stage_<n>"
  longName: "long name of a physical-property forcing series (e.g. Temperature, Salinity) used in <longName><i>.name"
  code: "group code part of a moving group/stage code <code>_stage_<n>"
  STAGE: "life stage, juvenile or adult (e.g. SeasonalDistribution/<GRP>/<STAGE>)"

