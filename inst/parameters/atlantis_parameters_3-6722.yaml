  # ===========================================================================
  # PER-GROUP SPECIES PARAMETERS - speciesParamStructArray[] master table at
  # atlantisUtil/atUtilXML.c:75-636. Each entry below has:
  #   prm key = <BASE>_<GRP> (or <GRP>_<SUFFIX> per the regEx field shown);
  #   read by Util_XML_Read_Species_Param() / Read_Cohort_Species_Param_Values()
